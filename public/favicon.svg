<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- AniArcade. A joystick on a vermilion seal: the same ink border and flat
       offset shadow as every button in the app (shadow-pop is a hard drop, not
       a blur), so the tab icon reads as part of the UI kit.
       Colours are the pop-pink / ink / paper colour tokens from src/index.css,
       hand-synced: a file in public/ cannot see the theme, so a palette change
       has to be repeated here or the tab icon silently keeps the old colours.
       No double hyphen anywhere in a comment here: XML forbids it, and the
       custom-property names this used to quote made the whole file fail to
       parse as an image (found rendering the app icons from it). -->

  <!-- Hard shadow. Drawn first and inset horizontally so it only peeks out
       below the tile, the way shadow-pop does. -->
  <rect x="4" y="7" width="40" height="36" rx="5" fill="#141414"/>

  <!-- Tile -->
  <rect x="4" y="3" width="40" height="36" rx="5" fill="#b4300f" stroke="#141414" stroke-width="3"/>

  <!-- Joystick. Shaft and base go down first so the ball caps the shaft. -->
  <rect x="21.25" y="18" width="5.5" height="11" fill="#141414"/>
  <rect x="12" y="27" width="24" height="7.5" rx="3.75" fill="#141414"/>
  <circle cx="24" cy="16" r="6" fill="#faf8f3" stroke="#141414" stroke-width="3"/>
</svg>
