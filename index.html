<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniArcade — anime games with friends</title>
    <!-- What a link to the arcade looks like when it is pasted into a chat — an
         invite link most of all (shared/utils/inviteLink.js). og:image must be
         an absolute URL; crawlers do not resolve a relative one. The image and
         the icons are rendered from public/art and favicon.svg, so a change to
         either is redone by hand, the way favicon.svg's colours are. -->
    <meta name="description" content="Party games built from your anime list — guess, rank, quiz and bluff with friends, on one phone or online." />
    <meta name="theme-color" content="#efebe2" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AniArcade" />
    <meta property="og:title" content="AniArcade — anime games with friends" />
    <meta property="og:description" content="Party games built from your anime list — guess, rank, quiz and bluff with friends, on one phone or online." />
    <meta property="og:url" content="https://aniarcade.web.app/" />
    <meta property="og:image" content="https://aniarcade.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AniArcade: party games built from your anime list" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
